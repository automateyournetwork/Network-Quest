<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Workshop model comparison</title>
<style>body{margin:0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<body><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();
const renderer = new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(480,480);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.NoToneMapping;
document.body.append(renderer.domElement);
const loader=new GLTFLoader();
const models=new Map();
const yup=([x,y,z])=>new T.Vector3(x,z,-y);
const makeScene=()=>{
  const scene=new T.Scene();
  scene.background=new T.Color(0x3a4951);
  scene.add(new T.HemisphereLight(0xe0ebef,0x64696a,.83));
  return scene;
};
window.inspect=async(id,native)=>{
  const scene=makeScene();
  const span=native.span,center=yup(native.center),cam=new T.OrthographicCamera(-span/2,span/2,span/2,-span/2,.01,150);
  cam.position.copy(yup(native.camera));
  cam.lookAt(center);
  for(const [at,intensity,color,size] of [[[-2,-3,4],16,0xffe0c2,2],[[3,-2,2],11,0xb9d6ff,2.2],[[1,2.5,3],24,0xd9ffeb,1.6]]){
    const light=new T.RectAreaLight(color,intensity,size*span,size*span);
    light.position.copy(center).addScaledVector(yup(at),span);
    light.lookAt(center);
    scene.add(light);
  }
  const result=await loader.loadAsync('/models/R02/'+id+'.glb');
  models.set(id,result.scene);
  scene.add(result.scene);
  renderer.render(scene,cam);
  const bounds=new T.Box3().setFromObject(result.scene,true);
  const [low,high]=native.bounds;
  const expected=[low[0],low[2],-high[1],high[0],high[2],-low[1]];
  const measured=[...bounds.min.toArray(),...bounds.max.toArray()];
  const gltf=result.parser.json;
  return {triangles:renderer.info.render.triangles,materialDraws:renderer.info.render.calls,
    boundsMetresYUp:measured,maxBoundErrorMetres:Math.max(...expected.map((v,i)=>Math.abs(v-measured[i]))),
    materialNames:gltf.materials.map(m=>m.name).sort(),meshes:gltf.meshes.length,
    embeddedBuffers:gltf.buffers.every(b=>!b.uri),animations:gltf.animations?.length??0,
    textures:gltf.textures?.length??0,threeRevision:T.REVISION};
};
window.staging=room=>{
  const scene=makeScene();
  const [w,h]=room.camera.plateSpan;
  const cam=new T.OrthographicCamera(-w/2,w/2,h/2,-h/2,.1,80);
  cam.position.fromArray(room.camera.position);
  cam.lookAt(...room.camera.target);
  const key=new T.DirectionalLight(0xffdec0,2.4);
  key.position.set(-2,5,3);scene.add(key);
  const fill=new T.DirectionalLight(0x9fcbd8,1.5);
  fill.position.set(1,3,-2);scene.add(fill);
  const verts=room.authoritativeWalkRegions[0].vertices;
  const floor=new T.Mesh(new T.ShapeGeometry(new T.Shape(verts.map(v=>new T.Vector2(v.x,-v.y)))),new T.MeshStandardMaterial({color:0x506779}));
  floor.rotation.x=-Math.PI/2;
  floor.position.y=-.015;
  scene.add(floor);
  const arrival=room.authoritativeSafePositions[0].point;
  const ring=new T.Mesh(new T.RingGeometry(.53,.60,40),new T.MeshBasicMaterial({color:0xF5D38D}));
  ring.rotation.x=-Math.PI/2;ring.position.set(arrival.x,.002,arrival.y);scene.add(ring);
  const positions=[];
  for(const p of room.propPlacements){
    const id=p.semanticId.split(':')[1],model=models.get(id);
    if(!model) continue;
    model.position.fromArray(p.position);
    scene.add(model);
    const b=new T.Box3().setFromObject(model,true);
    positions.push({id,position:p.position,quaternion:model.quaternion.toArray(),bounds:[b.min.toArray(),b.max.toArray()]});
  }
  renderer.setSize(960,540);
  renderer.render(scene,cam);
  return {scope:'Isolated frozen R02 camera and proposed floor anchors; runtime integration is pending.',
    positions,arrival,camera:room.camera.position,target:room.camera.target,span:[w,h],
    triangles:renderer.info.render.triangles,draws:renderer.info.render.calls};
};
</script></body></html>
