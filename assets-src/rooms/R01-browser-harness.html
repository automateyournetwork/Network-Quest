<!doctype html><html lang="en"><meta charset="utf-8"><title>T063 source/export inspection harness</title><style>body{margin:0;background:#182532}canvas{display:block}#label{position:absolute;left:16px;top:12px;color:#eee1be;font:16px system-ui;background:#182532bb;padding:8px;border-radius:6px}</style><div id="label">T063 asset inspection — isolated from game state</div><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RectAreaLightUniformsLib}from'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();const scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;document.body.append(renderer.domElement);const camera=new T.OrthographicCamera();const loader=new GLTFLoader();const assets={},mixers={};let current='R01';const placements=await fetch('/placements').then(r=>r.json());
scene.add(new T.HemisphereLight(0xb6d5e3,0x182532,1.0));
function area(pos,target,color,intensity,size){let l=new T.RectAreaLight(color,intensity,size,size);l.position.set(...pos);l.lookAt(...target);scene.add(l);return l;}
const lamps=[area([1,9,3],[4,0,3],0xffc78a,10,7),area([10,8,1],[5,1,3],0x80c2ff,8,6),area([5,7,-4],[5,1,3],0xccffe6,14,5)];
for(let id of ['R01','CH01','CH03','R01-architecture',...Array.from({length:10},(_,i)=>'R01-PR'+String(i+1).padStart(3,'0'))]){assets[id]=await loader.loadAsync('/models/'+id+'.glb');assets[id].scene.name=id;scene.add(assets[id].scene);mixers[id]=new T.AnimationMixer(assets[id].scene);}
function size(w=innerWidth,h=innerHeight){renderer.setSize(w,h);let hs=Math.max(9,13/(w/h));camera.left=-hs*w/h/2;camera.right=-camera.left;camera.top=hs/2;camera.bottom=-hs/2;camera.near=.1;camera.far=80;camera.position.set(12,13,16);camera.lookAt(5,1,3);if(current!=='R01'&&current!=='PROPS'&&current!=='COMPOSED'){let ph=current==='CH03',span=ph?2.3:3.8;camera.left=-span/2;camera.right=span/2;camera.top=span/(w/h)/2;camera.bottom=-camera.top;camera.position.set(...(ph?[2,2,3]:[3,2.7,5]));camera.lookAt(0,ph?1.3:.89,0);}camera.updateProjectionMatrix();camera.updateMatrixWorld();renderer.render(scene,camera);}
function show(id,roomCharacters=true){current=id;for(let[k,v]of Object.entries(assets)){v.scene.visible=id===k||(id==='R01'&&roomCharacters&&['CH01','CH03'].includes(k))||(id==='PROPS'&&k.startsWith('R01-PR'))||(id==='COMPOSED'&&k!=='R01');v.scene.position.set(0,0,0);}if(id==='R01'||id==='COMPOSED'){assets.CH01.scene.position.set(5,0,3);assets.CH03.scene.position.set(1.2,0,3.3);}if(id==='COMPOSED')for(let p of placements.props){assets[p.exportPath.split('/').at(-1).replace('.glb','')].scene.position.set(...p.runtimePosition);}if(id==='PROPS')Object.entries(assets).filter(([k])=>k.startsWith('R01-PR')).forEach(([k,v],i)=>v.scene.position.set(.5+(i%5)*2.1,0,.6+Math.floor(i/5)*3));for(let m of Object.values(mixers))m.stopAllAction();document.querySelector('#label').textContent=`T063 ${id} — isolated source/export inspection`;size();}
function clip(id,name,time){let m=mixers[id];m.stopAllAction();let c=T.AnimationClip.findByName(assets[id].animations,name);if(!c)throw Error('Missing clip '+name);let a=m.clipAction(c);a.setLoop(T.LoopOnce,1);a.clampWhenFinished=true;a.play();m.setTime(time);scene.updateMatrixWorld(true);renderer.render(scene,camera);return c.duration;}
function meshSamples(id){let r={};assets[id].scene.updateMatrixWorld(true);assets[id].scene.traverse(o=>{if(o.isMesh)r[o.name]=o.matrixWorld.elements.map(v=>+v.toFixed(7));});return r;}
function info(id){let g=assets[id],tris=0,mesh=0,uv=0;g.scene.traverse(o=>{if(o.isMesh){mesh++;tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;if(o.geometry.attributes.uv)uv++;}});let b=new T.Box3().setFromObject(g.scene);return{mesh,triangles:tris,uvMeshes:uv,bounds:{min:b.min.toArray(),max:b.max.toArray()},clips:g.animations.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length,animatedTargets:c.tracks.map(t=>t.name),varyingTracks:c.tracks.filter(t=>{let n=t.getValueSize();return t.values.some((v,i)=>i>=n&&Math.abs(v-t.values[i%n])>1e-6)}).length}))};}
window.inspect={show,clip,info,size,meshSamples,project:points=>points.map(p=>{let v=new T.Vector3(...p).project(camera);return[(v.x+1)*renderer.domElement.width/2,(1-v.y)*renderer.domElement.height/2];}),render:()=>renderer.render(scene,camera),rendererInfo:()=>({renderer:renderer.getContext().getParameter(renderer.getContext().RENDERER),vendor:renderer.getContext().getParameter(renderer.getContext().VENDOR),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles})};show('R01');window.ready=true;
</script></html>
