<!doctype html>
<html lang="en"><meta charset="utf-8"><title>T109 character inspection</title>
<style>body{margin:0;background:#384851} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<body><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(480,480);
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.NoToneMapping;
document.body.append(renderer.domElement);
const up=(v)=>new T.Vector3(v[0],v[2],-v[1]);
const C=new T.Matrix4().makeRotationX(-Math.PI/2);
const ci=C.clone().invert();
const loader=new GLTFLoader();
let scene,camera,asset,mixer,nodes;
window.inspect={
 async stageR11(room){
    const scene=new T.Scene();scene.background=new T.Color(0x263742);
    scene.add(new T.HemisphereLight(0xdcede7,0x54606c,1.55));
    const key=new T.DirectionalLight(0xffdfbf,2.6);key.position.set(-1,3,2);scene.add(key);
    const fill=new T.DirectionalLight(0x9cc8de,1.6);fill.position.set(1,2,-1);scene.add(fill);
    const scale=room.camera.plateSpan;
    const c=new T.OrthographicCamera(-scale[0]/2,scale[0]/2,scale[1]/2,-scale[1]/2,.1,80);
    c.position.fromArray(room.camera.position);c.lookAt(...room.camera.target);c.updateMatrixWorld(true);
    const verts=room.authoritativeWalkRegions[0].vertices;
    const shape=new T.Shape(verts.map(v=>new T.Vector2(v.x,-v.y)));
    const floor=new T.Mesh(new T.ShapeGeometry(shape),new T.MeshStandardMaterial({color:0x405965}));
    floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
    const ordered=[...verts,verts[0]].map(v=>new T.Vector3(v.x,0,v.y));
    scene.add(new T.Line(new T.BufferGeometry().setFromPoints(ordered),new T.LineBasicMaterial({color:0xba986b})));
    const safe=room.authoritativeSafePositions.find(p=>p.id.endsWith('.preparation')).point;
    const ring=new T.Mesh(new T.RingGeometry(.22,.27,40),new T.MeshBasicMaterial({color:0xe8d8b1}));
    ring.rotation.x=-Math.PI/2;ring.position.set(safe.x,.003,safe.y);scene.add(ring);
    const placements=[
      ['CH25',room.characterPlacements.find(v=>v.characterId==='spec001:CH25').position,0],
      ['CH20',room.partyStaging.positions[0],64],['CH19',room.partyStaging.positions[1],-46]];
    const observed=[];
    for(const [id,pos,yaw] of placements){
      const g=await loader.loadAsync('/models/'+id+'.glb');
      g.scene.position.fromArray(pos);g.scene.rotation.y=yaw*Math.PI/180;scene.add(g.scene);
      scene.updateMatrixWorld(true);
      const bounds=new T.Box3().setFromObject(g.scene,true);
      observed.push({id,position:pos,yawDegrees:yaw,min:bounds.min.toArray(),max:bounds.max.toArray()});
    }
    renderer.setSize(960,540);renderer.render(scene,c);
    return {frozenCamera:room.camera.position,target:room.camera.target,plateSpan:scale,
      safePoint:safe,observed,draws:renderer.info.render.calls,scope:'Isolated GLBs with the frozen presentation anchors and preparation marker. No game-state or runtime-usage claim.'};
 },
 partyBounds(degrees){
    const orientation=asset.scene.quaternion.clone();
    asset.scene.rotation.y=degrees*Math.PI/180;
    asset.scene.updateMatrixWorld(true);
    const b=new T.Box3().setFromObject(asset.scene,true);
    asset.scene.quaternion.copy(orientation);asset.scene.updateMatrixWorld(true);
    return [...b.min.toArray(),...b.max.toArray()];
 },
 async load(id,native){
    if(asset){
      asset.scene.traverse(o=>{
        if(o.isMesh){o.geometry.dispose();for(const m of [].concat(o.material))m.dispose();}
      });
    }
    scene=new T.Scene();
    scene.background=new T.Color(0x263742);
    const target=up(native.studioCenter),span=native.studioSpan;
    camera=new T.OrthographicCamera(-span/2,span/2,span/2,-span/2,.01,150);
    camera.position.copy(up(native.studioCameraBlender));camera.lookAt(target);
    scene.add(new T.HemisphereLight(0xe0ebef,0x64696a,.83));
    for(const [v,intensity,col,size] of [[[-2,-3,4],16,0xffe0c2,2],[[3,-2,2],11,0xb9d6ff,2.2],[[1,2.5,3],24,0xd9ffeb,1.6]]){
      const light=new T.RectAreaLight(col,intensity,size*span,size*span);
      light.position.copy(target).addScaledVector(up(v),span);
      light.lookAt(target);scene.add(light);
    }
    asset=await loader.loadAsync('/models/'+id+'.glb');
    nodes={};
    asset.scene.traverse(o=>{
      const index=asset.parser.associations.get(o)?.nodes;
      if(index!==undefined)nodes[asset.parser.json.nodes[index].name]=o;
    });
    scene.add(asset.scene);mixer=new T.AnimationMixer(asset.scene);
    renderer.render(scene,camera);
    return {triangles:renderer.info.render.triangles,draws:renderer.info.render.calls,
      materials:asset.parser.json.materials.map(m=>m.name),meshes:asset.parser.json.meshes.length,
      clips:asset.animations.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length,
        varying:c.tracks.filter(t=>{
          const n=t.getValueSize();return t.values.some((v,i)=>i>=n&&Math.abs(v-t.values[i%n])>1e-6);
        }).length}))};
 },
 pose(name,frac,source,root){
    mixer.stopAllAction();
    const clip=T.AnimationClip.findByName(asset.animations,name);
    const action=mixer.clipAction(clip);
    action.reset().setLoop(T.LoopOnce,1);action.clampWhenFinished=true;action.play();
    mixer.setTime(frac*clip.duration);
    scene.updateMatrixWorld(true);renderer.render(scene,camera);
    let error=0,worst='';
    for(const [name,row] of Object.entries({...source.joints,[root]:source.root})){
      const expected=C.clone().multiply(new T.Matrix4().set(...row)).multiply(ci);
      const e=Math.max(...expected.elements.map((v,i)=>Math.abs(v-nodes[name].matrixWorld.elements[i])));
      if(e>error){error=e;worst=name;}
    }
    const box=new T.Box3().setFromObject(asset.scene,true);
    const [lo,hi]=source.boundsBlender;
    const bb=[lo[0],lo[2],-hi[1],hi[0],hi[2],-lo[1]];
    const actual=[...box.min.toArray(),...box.max.toArray()];
    return {fraction:frac,maxJointComponentError:error,worstJoint:worst,
      maxBoundsErrorMetres:Math.max(...actual.map((v,i)=>Math.abs(v-bb[i]))),
      comparedJoints:Object.keys(source.joints).length+1,boundsRuntime:actual};
 }
};
</script></body></html>
